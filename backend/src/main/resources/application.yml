spring:
  config:
    import: "optional:classpath:application-local.properties"
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zalo_clone}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&createDatabaseIfNotExist=true"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    hikari:
      pool-name: "ZaloDB-Pool"
      maximum-pool-size: "${HIKARI_MAX_POOL:5}"
      minimum-idle: "${HIKARI_MIN_IDLE:2}"
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: "${SHOW_SQL:false}"
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: "classpath:db/migration"
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      url: "${REDIS_URL:redis://localhost:6379}"
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  ai:
    openai:
      api-key: "${GROQ_API_KEY:}"
      base-url: "https://api.groq.com/openai"
      chat:
        options:
          model: "llama-3.1-8b-instant"
          temperature: 0.7
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  redis:
    online-ttl-seconds: "${REDIS_ONLINE_TTL:120}"
    ai-rate-limit: "${AI_RATE_LIMIT:10}"
  jwt:
    secret: "${JWT_SECRET:dinh-cao-architect-zalo-clone-2026-secret-key}"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://zalo-fullstack-app.vercel.app}"
  ai:
    system-prompt: "Bạn là trợ lý AI thông minh tích hợp trong ứng dụng chat Zalo Clone. \
      Hãy trả lời bằng tiếng Việt khi người dùng viết tiếng Việt, và bằng tiếng Anh khi họ viết tiếng Anh. \
      Câu trả lời nên ngắn gọn, rõ ràng và hữu ích."

r2:
  access-key-id: "${R2_ACCESS_KEY_ID:default-access-key}"
  secret-access-key: "${R2_SECRET_ACCESS_KEY:default-secret-key}"
  bucket: "${R2_BUCKET:zalo-media}"
  region: "${R2_REGION:auto}"
  endpoint: "${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}"

brevo:
  api:
    key: "${BREVO_API_KEY:your-brevo-api-key}"
  sender:
    email: "${BREVO_SENDER_EMAIL:your-email@gmail.com}"
    name: "${BREVO_SENDER_NAME:Zalo Clone}"

logging:
  level:
    org:
      springframework:
        web: "${LOG_LEVEL_WEB:INFO}"
      hibernate:
        orm:
          jdbc:
            bind: "${LOG_LEVEL_BIND:warn}"
    com:
      example:
        backend: "${LOG_LEVEL_APP:INFO}"

server:
  port: "${PORT:8080}"

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: "never"

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5000ms
        slow-call-rate-threshold: 100
